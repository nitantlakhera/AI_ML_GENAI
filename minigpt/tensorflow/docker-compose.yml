# MiniGPT (TensorFlow) docker-compose
# -----------------------------------
# Build context is the REPO ROOT (..) so the shared common/ folder is included.
# checkpoints/ is mounted so the trained model persists on the host.
#
#   docker compose run --rm train
#   docker compose run --rm chat

services:
  train:
    build:
      context: ..
      dockerfile: tensorflow/Dockerfile
    command: python train.py
    volumes:
      - ./checkpoints:/app/tensorflow/checkpoints

  chat:
    build:
      context: ..
      dockerfile: tensorflow/Dockerfile
    command: python chat.py
    stdin_open: true
    tty: true
    volumes:
      - ./checkpoints:/app/tensorflow/checkpoints
